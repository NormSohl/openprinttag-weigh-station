; Two environments:
;   weigh-station — the real firmware (default)
;   diag          — a dependency-free bring-up sketch; see src/diag/main.cpp
;                   Build with:  pio run -e diag -t upload -t monitor

; Shared TFT_eSPI configuration. Passed as -D so EVERY translation unit — ours
; and the library's own sources — compiles with identical settings, and so the
; diag environment tests the exact same display config as the firmware.
; Hosyond / MSP3520-type 3.5" ILI9488 480x320.
[common]
tft_flags =
    -DUSER_SETUP_LOADED=1
    -DILI9488_DRIVER=1
    ; Force the SPI peripheral. Without this TFT_eSPI picks the port itself on
    ; ESP32-S3 and init() ends up with an uninitialised bus handle — it panics
    ; with a null-pointer store inside begin_tft_write() before drawing anything
    ; (reproduced with a bare display-only sketch, no other library loaded).
    -DUSE_HSPI_PORT=1
    -DTFT_MOSI=11               ; board silk 11/PICO
    -DTFT_SCLK=12               ; board silk 12/SCK
    -DTFT_MISO=13               ; board silk 13/POCI
    -DTFT_CS=15
    -DTFT_DC=16
    -DTFT_RST=17
    -DSPI_FREQUENCY=27000000    ; safe over jumpers; raise only after testing
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_FONT7=1
    -DLOAD_FONT8=1
    -DLOAD_GFXFF=1
    -DSMOOTH_FONT=1

[env:weigh-station]
platform  = espressif32
board     = sparkfun_esp32s3_thing_plus
framework = arduino

; Everything in src/ EXCEPT the diagnostic sketch (it has its own setup/loop).
build_src_filter = +<*> -<diag/>

; 4 MB flash (verified N4R2): single 1.875 MB app (no OTA) + 2 MB LittleFS.
; See partitions.csv.
board_build.partitions = partitions.csv

monitor_speed = 115200

; Native USB (USB-Serial/JTAG) on this board: the monitor's DTR/RTS lines are
; wired to reset + bootloader entry, so a monitor that asserts them can hold the
; chip in reset (symptom: connects fine, prints nothing, board appears dead).
; Leave both deasserted — the board runs normally while we watch it.
monitor_dtr = 0
monitor_rts = 0

; Bring-up aids. esp32_exception_decoder turns a panic backtrace of raw hex
; addresses into function + file:line (needs the ELF, which PIO supplies) —
; the difference between "Backtrace: 0x42008f3a…" and "nfcTask() at
; nfc_task.cpp:112". time stamps each line with its arrival time.
monitor_filters = esp32_exception_decoder, time

extra_scripts = pre:scripts/pre_tinycbor.py

build_flags =
    -DCORE_DEBUG_LEVEL=3        ; verbose ESP-IDF log output during development

    ; ── TFT_eSPI configuration ────────────────────────────────────────────────
    ; Passed as -D so EVERY translation unit — ours and the library's own
    ; sources — is compiled with identical settings. (A force-included header
    ; is fragile here: if the library's TUs don't see the same defines, its
    ; conditionally-compiled members change layout and init() silently skips
    ; bus/register setup, which panics with a null pointer in begin_tft_write.)
    ; Hosyond / MSP3520-type 3.5" ILI9488 480x320; SPI bus SHARED with the
    ; PN5180 (gSpiMutex serialises access). DMA left off on a shared bus.
    ${common.tft_flags}

lib_deps =
    https://github.com/ATrappmann/PN5180-Library.git
    https://github.com/sparkfun/SparkFun_Qwiic_Scale_NAU7802_Arduino_Library.git
    bodmer/TFT_eSPI
    adafruit/Adafruit NeoPixel
    bblanchon/ArduinoJson
    tzapu/WiFiManager
    https://github.com/intel/tinycbor.git
    ; Async web server for the built-in inventory/onboarding UI (Phase 4).
    ; ESP32Async fork — maintained, builds on arduino-esp32 2.x and 3.x.
    https://github.com/ESP32Async/AsyncTCP.git
    https://github.com/ESP32Async/ESPAsyncWebServer.git

; ── Bring-up diagnostic ───────────────────────────────────────────────────────
; Same board/partitions as the real firmware, but compiles ONLY src/diag and
; links no libraries. Isolates "is the board+toolchain sound?" from "is our
; application code at fault?" — if this runs and the real firmware doesn't, the
; problem is ours; if neither runs, it's board config or hardware.
[env:diag]
platform  = espressif32
board     = sparkfun_esp32s3_thing_plus
framework = arduino
board_build.partitions = partitions.csv

build_src_filter = -<*> +<diag/>
build_flags = -DCORE_DEBUG_LEVEL=3

; Only the NFC library — no TFT, so nothing else can claim the SPI pins.
; (Swap back to bodmer/TFT_eSPI + ${common.tft_flags} to re-run the display
; isolation test; see the header of src/diag/main.cpp.)
lib_deps = https://github.com/ATrappmann/PN5180-Library.git

monitor_speed   = 115200
monitor_dtr     = 0
monitor_rts     = 0
monitor_filters = esp32_exception_decoder, time
