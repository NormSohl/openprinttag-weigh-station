; Two environments:
;   weigh-station — the real firmware (default)
;   diag          — a dependency-free bring-up sketch; see src/diag/main.cpp
;                   Build with:  pio run -e diag -t upload -t monitor

; default_envs is what makes "(default)" above TRUE. Without it, `pio run -t
; upload` builds and uploads EVERY environment in this file, in order — so the
; diag sketch went on last and silently replaced the firmware that had just
; been flashed. The board then came up showing "shared bus diag" and polling
; for tags, which looks like the weigh station having lost its mind rather than
; a different program running.
;
; With this set, `pio run` and `pio run -t upload` mean the firmware; diag is
; opt-in via -e diag, exactly as the line above says.
[platformio]
default_envs = weigh-station

; Shared TFT_eSPI configuration. Passed as -D so EVERY translation unit — ours
; and the library's own sources — compiles with identical settings, and so the
; diag environment tests the exact same display config as the firmware.
; Hosyond / MSP3520-type 3.5" ILI9488 480x320.
[common]
tft_flags =
    -DUSER_SETUP_LOADED=1
    -DILI9488_DRIVER=1
    ; MANDATORY on the ESP32-S3 — do not remove. TFT_eSPI's S3 port is
    ; hard-wired to the SPI3 peripheral for its register-level writes:
    ;
    ;   Processors/TFT_eSPI_ESP32_S3.h:31
    ;     #define REG_SPI_BASE(i) (((i)>1) ? DR_REG_SPI3_BASE : DR_REG_SPI2_BASE)
    ;
    ; SPI_PORT is 3 with USE_HSPI_PORT and 2 without — and BOTH are > 1, so
    ; that macro yields SPI3 either way. SET_BUS_WRITE_MODE / TFT_WRITE_BITS
    ; therefore always poke SPI3's registers.
    ;
    ; With USE_HSPI_PORT the Arduino side is SPIClass(HSPI) = bus 1 = SPI3 too,
    ; so the two agree. WITHOUT it, TFT_eSPI binds the global SPI object
    ; (bus 0 = SPI2) while still writing SPI3's registers — a peripheral whose
    ; clock was never enabled. Result: StoreProhibited inside begin_tft_write()
    ; at the first writecommand(), which is a boot loop, not a subtle bug.
    ;
    ; Consequence: the display owns SPI3 and the PN5180 (ATrappmann's library
    ; hardcodes the global SPI = SPI2) owns SPI2, yet both drive GPIO 11/12.
    ; spiAttachSCK() ends in pinMatrixOutAttach(), a write to the pin's
    ; single-valued func_out_sel register, so the last attach silently wins.
    ; src/spi_bus.cpp re-routes SCK/MOSI on every gSpiMutex handoff to keep
    ; both alive. See the header comment there.
    -DUSE_HSPI_PORT=1
    -DTFT_MOSI=11               ; board silk 11/PICO
    -DTFT_SCLK=12               ; board silk 12/SCK
    ; NO MISO for the display, deliberately: the ILI9488's SDO does NOT
    ; tri-state when its CS is high (documented TFT_eSPI limitation), so
    ; leaving it on the shared bus lets the panel drive MISO permanently and
    ; every other device's replies read back as garbage. We only ever write to
    ; the display, so -1 costs nothing. The TFT's SDO pin must also be
    ; physically OFF the MISO splice — see hardware/netlist.md.
    -DTFT_MISO=-1
    -DTFT_CS=15
    -DTFT_DC=16
    -DTFT_RST=17
    -DSPI_FREQUENCY=27000000    ; safe over jumpers; raise only after testing
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_FONT7=1
    -DLOAD_FONT8=1
    -DLOAD_GFXFF=1
    -DSMOOTH_FONT=1

[env:weigh-station]
platform  = espressif32
board     = sparkfun_esp32s3_thing_plus
framework = arduino

; Everything in src/ EXCEPT the diagnostic sketch (it has its own setup/loop).
build_src_filter = +<*> -<diag/>

; 4 MB flash (verified N4R2): single 1.875 MB app (no OTA) + 2 MB LittleFS.
; See partitions.csv.
board_build.partitions = partitions.csv

monitor_speed = 115200

; Native USB (USB-Serial/JTAG) on this board: the monitor's DTR/RTS lines are
; wired to reset + bootloader entry, so a monitor that asserts them can hold the
; chip in reset (symptom: connects fine, prints nothing, board appears dead).
; Leave both deasserted — the board runs normally while we watch it.
monitor_dtr = 0
monitor_rts = 0

; Bring-up aids. esp32_exception_decoder turns a panic backtrace of raw hex
; addresses into function + file:line (needs the ELF, which PIO supplies) —
; the difference between "Backtrace: 0x42008f3a…" and "nfcTask() at
; nfc_task.cpp:112". time stamps each line with its arrival time.
monitor_filters = esp32_exception_decoder, time

; Echo what you type. The serial harness (ZERO / CAL / SEED / COMPACT /
; DUMP / APIKEY ...) is driven by typing into the monitor, and without
; this the characters are invisible — you cannot see a typo before you
; press Enter, on a console where some commands rewrite the event log.
monitor_echo = yes

extra_scripts = pre:scripts/pre_tinycbor.py

build_flags =
    -DCORE_DEBUG_LEVEL=3        ; verbose ESP-IDF log output during development

    ; Uncomment to trace every gState transition on the serial console as
    ; "[nfc] old -> new" / "[sync] old -> new". Off by default (noisy). This is
    ; the diagnostic that found the two-writer stomp; see the state-machine
    ; ownership refactor in docs/design/state-machine-ownership.md.
    ; -DSTATE_TRACE

    ; ── TFT_eSPI configuration ────────────────────────────────────────────────
    ; Passed as -D so EVERY translation unit — ours and the library's own
    ; sources — is compiled with identical settings. (A force-included header
    ; is fragile here: if the library's TUs don't see the same defines, its
    ; conditionally-compiled members change layout and init() silently skips
    ; bus/register setup, which panics with a null pointer in begin_tft_write.)
    ; Hosyond / MSP3520-type 3.5" ILI9488 480x320; SPI bus SHARED with the
    ; PN5180 (gSpiMutex serialises access). DMA left off on a shared bus.
    ${common.tft_flags}

lib_deps =
    https://github.com/ATrappmann/PN5180-Library.git
    https://github.com/sparkfun/SparkFun_Qwiic_Scale_NAU7802_Arduino_Library.git
    bodmer/TFT_eSPI
    adafruit/Adafruit NeoPixel
    bblanchon/ArduinoJson
    tzapu/WiFiManager
    https://github.com/intel/tinycbor.git
    ; Async web server for the built-in inventory/onboarding UI (Phase 4).
    ; ESP32Async fork — maintained, builds on arduino-esp32 2.x and 3.x.
    https://github.com/ESP32Async/AsyncTCP.git
    https://github.com/ESP32Async/ESPAsyncWebServer.git
    ; QR encoder for the idle screen's "scan to open the web app" code.
    ; Header-light, no dynamic allocation — it fills a caller-supplied buffer.
    https://github.com/ricmoo/QRCode.git

; ── Bring-up diagnostic ───────────────────────────────────────────────────────
; Same board/partitions as the real firmware, but compiles ONLY src/diag and
; links no libraries. Isolates "is the board+toolchain sound?" from "is our
; application code at fault?" — if this runs and the real firmware doesn't, the
; problem is ours; if neither runs, it's board config or hardware.
[env:diag]
platform  = espressif32
board     = sparkfun_esp32s3_thing_plus
framework = arduino
board_build.partitions = partitions.csv

build_src_filter = -<*> +<diag/>

; Same TFT config as the firmware — the point of this build is to reproduce the
; PN5180 + TFT bus contention exactly, minus the application code.
build_flags =
    -DCORE_DEBUG_LEVEL=3
    ${common.tft_flags}

lib_deps =
    https://github.com/ATrappmann/PN5180-Library.git
    bodmer/TFT_eSPI

monitor_speed   = 115200
monitor_dtr     = 0
monitor_rts     = 0
monitor_filters = esp32_exception_decoder, time

; Echo what you type. The serial harness (ZERO / CAL / SEED / COMPACT /
; DUMP / APIKEY ...) is driven by typing into the monitor, and without
; this the characters are invisible — you cannot see a typo before you
; press Enter, on a console where some commands rewrite the event log.
monitor_echo = yes
