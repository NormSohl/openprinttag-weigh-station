# nginx site on the public (Sohl) server. See README.md.
# Replace weighstation.example.com, then get a certificate, e.g.:
#   sudo certbot --nginx -d weighstation.example.com
#
# The station itself has no HTTPS and treats the lab LAN as its security
# boundary, so this file is what makes remote access safe: TLS, a login in
# front of EVERY path (reads included), and nothing reachable without both.

server {
    listen 80;
    server_name weighstation.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name weighstation.example.com;

    # certbot fills these in.
    # ssl_certificate     /etc/letsencrypt/live/weighstation.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/weighstation.example.com/privkey.pem;

    auth_basic           "Weigh Station";
    auth_basic_user_file /etc/nginx/weighstation.htpasswd;

    # /import uploads a whole event-log backup (the log partition is 2 MB).
    client_max_body_size 4m;

    # The tunnel ends here, on loopback only.
    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # The station holds very few connections at once; fail fast rather
        # than queue behind it when it is busy or the tunnel is down.
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # Server-Sent Events: the live page updates. Must stream, not buffer,
    # or pages stop reacting to spools placed on the scale.
    location = /events {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }
}
